title: Execução de Shell e LOLBins via Aplicações Microsoft Office
id: e4b2c1d3-8f9a-4b72-91e8-3a21bc901ef4
status: test
description: |
  Detecta a criação de interpretadores de comandos (PowerShell, CMD), utilitários de sistema (LOLBins) 
  e motores de script iniciados diretamente por processos da suíte Microsoft Office (Word, Excel, PowerPoint, Outlook, Visio, Access).
  Padrão altamente correlacionado a vetores de ataque via Phishing e execução de macros maliciosas.
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1566/001/
  - https://lolbas-project.github.io/
author: Blue Team Lab - Threat Detection Engineering
date: 2026/08/28
modified: 2026/08/28
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
  - attack.t1218
  - attack.t1566.001
logsource:
  category: process_creation
  product: windows
detection:
  # 1. Processos Pai: Cobertura expandida da suíte Office
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\mspub.exe'
      - '\visio.exe'
      - '\msaccess.exe'
      - '\eqnedt32.exe' # Editor de equações (frequentemente explorado em vulnerabilidades legadas)

  # 2. Processos Filhos: Interpretadores de Comandos e LOLBins Suspeitos
  selection_child_interpreters:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\bash.exe'

  selection_child_lolbins:
    Image|endswith:
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
      - '\schtasks.exe'
      - '\wmic.exe'
      - '\carl.exe'

  # 3. Exclusões de Falsos Positivos Conhecidos em Ambientes Corporativos
  filter_legitimate_addins:
    Image|endswith:
      - '\splworkflow.exe' # Exemplo de integrador de impressão/fluxo corporativo
    CommandLine|contains:
      - 'LegitimateCorporatePlugin'

  condition: selection_parent and (selection_child_interpreters or selection_child_lolbins) and not filter_legitimate_addins

falsepositives:
  - Add-ins legítimos e homologados de terceiros integrados ao Office.
  - Scripts de automação VBA internos que interagem com o prompt de comando para tarefas administrativas.

level: high




